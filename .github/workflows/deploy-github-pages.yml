name: Deploy static landing to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static landing
        run: |
          node --check site/app.js
          node --check site/research-objective.js
          node --check site/report/renderer.js
          node --check site/report/report.js
          node --check site/portal/portal.js
          node --test test/static_credits_test.mjs test/static_research_objective_test.mjs test/static_lead_form_defaults_test.mjs test/static_report_renderer_test.mjs test/editorial_pipeline_contract_test.mjs test/request_notification_pipeline_test.mjs test/report_export_delivery_test.mjs test/portal_feedback_update_test.mjs
          LEAD_ENDPOINT="${{ secrets.LEAD_ENDPOINT }}" \
          CONTACT_ENDPOINT="${{ secrets.CONTACT_ENDPOINT }}" \
          REPORT_ENDPOINT="${{ secrets.REPORT_ENDPOINT }}" \
            bash scripts/build_static_site.sh build/site
          grep -q '<script src="research-objective.js"></script>' build/site/index.html
          test -f build/site/research-objective.js
          test -f build/site/report/index.html
          test -f build/site/report/renderer.js
          test -f build/site/report/report.js
          test -f build/site/portal/index.html
          test -f build/site/portal/portal.js
          grep -q 'reportEndpoint' build/site/config.js

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
