name: Deploy Flutter web to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: |
          BASE_HREF="${{ vars.BASE_HREF }}"
          if [ -z "$BASE_HREF" ]; then
            BASE_HREF="/"
          fi

          flutter build web \
            --release \
            --base-href "$BASE_HREF" \
            --dart-define=LEAD_ENDPOINT="${{ secrets.LEAD_ENDPOINT }}"

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --assets ./build/web --name induradarweb
