name: WebHMI online separation
on:
  push:
    paths: ['HMI_NX/online/**', 'HMI_NX_ST/**', '.github/workflows/webhmi-online.yml']
  pull_request:
    paths: ['HMI_NX/online/**', 'HMI_NX_ST/**', '.github/workflows/webhmi-online.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python HMI_NX/online/tool/build.py
      - run: node --test HMI_NX/online/test/*.test.cjs HMI_NX_ST/tests/*.test.cjs
      - run: node --check HMI_NX/online/public/app.js && node --check HMI_NX/online/public/online.js
