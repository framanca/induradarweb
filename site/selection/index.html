)}td a{font-weight:700}td small{display:block;line-height:1.4;color:var(--muted);font-size:11px;margin-top:4px}

<body>
  <header class="topbar"><a class="brand" href="/portal/"><img src="../assets/InduRadarLogoVertical-128.webp" alt="InduRadar"><span><strong>InduRadar</strong><small>INTELIGENCIA COMERCIAL</small></span></a><a href="/portal/">Mis informes</a></header>
  <main class="shell">
    <div id="selection-status" class="status" role="status">Cargando selección…</div>
    <section id="selection-auth" class="auth-card" hidden>
      <h1>Accede a tu informe</h1><p>Esta selección pertenece a tu cuenta de InduRadar.</p>
      <form id="selection-login"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Entrar</button></form>
      <p><a href="/portal/">Recuperar acceso o gestionar mi cuenta</a></p>
    </section>
    <nav id="selection-tools" class="tools" aria-label="Acciones del informe" hidden><a href="#seleccion">Índice de oportunidades</a><button id="selection-json" type="button">Report JSON</button><button id="selection-light" type="button">Light Report JSON</button><button id="selection-print" type="button">Imprimir</button></nav>
    <div id="selection-root"></div>
    <p class="footer">InduRadar · Documento de uso comercial de la cuenta destinataria</p>
  </main>
