<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#075a8f">
  <title>Informe | InduRadar</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="report.css">
</head>
<body>
  <header class="report-topbar">
    <a class="brand" href="/" aria-label="InduRadar, inicio">
      <img src="../assets/InduRadarLogoVertical-128.webp" width="54" height="54" alt="InduRadar">
      <span><strong>InduRadar</strong><small>Industrial Opportunity Intelligence</small></span>
    </a>
    <div class="report-identity">
      <strong id="report-reference">Informe</strong>
      <span id="report-date"></span>
    </div>
    <button id="print-report" type="button" hidden>Imprimir / PDF</button>
  </header>

  <main class="report-shell">
    <nav class="report-nav" aria-label="Secciones del informe">
      <a href="#resumen">Resumen</a>
      <a href="#oportunidades">Oportunidades</a>
      <a href="#universo">Universo</a>
      <a href="#fuentes">Fuentes</a>
    </nav>
    <div id="report-status" class="report-status" role="status" aria-live="polite"></div>
    <section id="report-auth" class="report-auth" hidden aria-labelledby="report-auth-title">
      <p class="eyebrow">Acceso seguro</p>
      <h2 id="report-auth-title">Entra para ver este informe</h2>
      <p>Usa tu cuenta de InduRadar para acceder a los informes que tienes asignados.</p>
      <div id="report-auth-status" class="report-auth-status" hidden role="status" aria-live="polite"></div>
      <form id="report-auth-form">
        <label>Email<input name="email" type="email" autocomplete="email" required></label>
        <label>Contraseña<input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
        <button type="submit">Entrar</button>
        <button class="report-link-button" type="button" id="report-forgot-password">He olvidado mi contraseña</button>
      </form>
    </section>
    <div id="report-root"></div>
  </main>

  <footer class="report-footer">
    <span>induradar.com</span>
    <span>Informe confidencial para el destinatario autorizado</span>
  </footer>

  <script src="../config.js"></script>
  <script type="module" src="report.js"></script>
</body>
</html>
